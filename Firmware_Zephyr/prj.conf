# =================================================
# CONFIGURAZIONE MEMORIA (Ottimizzata per STM32 RAM)
# =================================================
# Stack del main thread (non usato attivamente, va bene così)
CONFIG_MAIN_STACK_SIZE=4096
# Heap aumentato: STAI API 4.x può fare allocazioni interne
# durante init/run anche con array statici dichiarati da noi
CONFIG_HEAP_MEM_POOL_SIZE=8192

# =================================================
# CONFIGURAZIONE LIBRERIA C E CONSOLE
# =================================================
CONFIG_PICOLIBC=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# =================================================
# CONFIGURAZIONE HARDWARE E PIN
# =================================================
CONFIG_FPU=y
CONFIG_FP_HARDABI=y
CONFIG_GPIO=y

# CMSIS-DSP per FFT
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y
CONFIG_CMSIS_DSP_FASTMATH=y